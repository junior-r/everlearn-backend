name: Publish Docker image

# Builds the production image and pushes it to the GitHub Container Registry on every push to main
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The registry only accepts lowercase names, whatever the account is called
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/everlearn-backend" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The production image has no Prisma CLI: migrations are applied from this one, before the backend starts
      - name: Build and push the migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main-migrate
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}-migrate
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
